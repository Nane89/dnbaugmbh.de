<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kontakt — DN Bau GmbH</title>
  <meta name="description" content="Kontaktieren Sie DN Bau GmbH für Projektanfragen, Angebote und Beratung.">
  <meta property="og:title" content="Kontakt — DN Bau GmbH">
  <meta property="og:description" content="Kontaktieren Sie uns für Projektanfragen und Angebote.">
  <meta name="twitter:card" content="summary">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="img/logo/DNBauGmbHlogo.png">
  <link rel="canonical" href="https://example.com/contact.html">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="index.html"><img src="img/logo/DNBauGmbHlogo.png" alt="DN Bau GmbH" height="48" decoding="async"></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Navigation öffnen">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavigation">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Startseite</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">Über uns</a></li>
            <li class="nav-item"><a class="nav-link" href="services.html">Leistungen</a></li>
            <li class="nav-item"><a class="nav-link" href="projects.html">Projekte</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="contact.html">Kontakt</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="py-5">
    <div class="container">
      <header class="mb-4">
        <h1 class="display-5 fw-bold">Kontakt</h1>
        <p class="text-muted">Senden Sie uns Ihre Projektanfrage — wir melden uns zeitnah.</p>
      </header>

      <div class="row g-4">
        <div class="col-lg-7">
          <form id="contact-form" class="card p-4 shadow-sm" action="https://formspree.io/f/your-form-id" method="POST" novalidate>
            <input type="hidden" name="_subject" value="Neue Anfrage über Website">
            <input type="hidden" name="_next" value="https://example.com/thank-you.html">
            <input type="hidden" name="_captcha" value="false">
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">E-Mail</label>
              <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
              <label for="message" class="form-label">Nachricht</label>
              <textarea class="form-control" id="message" name="message" rows="6" required></textarea>
            </div>
            <div class="mb-3">
              <button class="btn btn-primary" type="submit">Nachricht senden</button>
            </div>
            <noscript>
              <p class="text-danger small">JavaScript ist deaktiviert. Bitte senden Sie Ihre Anfrage per E-Mail an <a href="mailto:info@example.com">info@example.com</a>.</p>
            </noscript>
          </form>
        </div>

        <aside class="col-lg-5">
          <div class="card p-3 shadow-sm">
            <h4 class="h6">DN Bau GmbH</h4>
            <address class="small text-muted">[Straße und Hausnummer]<br>[PLZ] [Stadt]</address>
            <p class="small text-muted mb-1">Telefon: <a href="tel:+49123456789">+49 123 456789</a></p>
            <p class="small text-muted">E-Mail: <a href="mailto:info@example.com">info@example.com</a></p>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-light py-5">
    <div class="container text-center small">© <span id="current-year">2026</span> DN Bau GmbH — <a href="impressum.html" class="text-light">Impressum</a> — <a href="datenschutz.html" class="text-light">Datenschutz</a></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js" defer></script>
</body>
</html>
